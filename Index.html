&amp;lt;section&amp;gt;&amp;lt;h2&amp;gt;🎯 Dars maqsadi&amp;lt;/h2&amp;gt;
&amp;lt;div class=&amp;quot;grid&amp;quot;&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;Moddaning molekulyar tuzilishini tushunish&amp;lt;/div&amp;gt;

&amp;lt;section&amp;gt;&amp;lt;h2&amp;gt;1. Moddaning molekulyar tuzilishi&amp;lt;/h2&amp;gt;
&amp;lt;p&amp;gt;Barcha moddalar juda kichik zarrachalardan — atom va molekulalardan tashkil topgan. &amp;lt;b&amp;gt;Molekula&amp;lt;/b&amp;gt; — moddaning uning asosiy xossalarini saqlab qoluvchi eng kichik zarrachalaridan biridir.&amp;lt;/p&amp;gt;
&amp;lt;div class=&amp;quot;grid&amp;quot;&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Qattiq jism:&amp;lt;/b&amp;gt; zarrachalar zich joylashgan, muvozanat holati atrofida tebranadi.&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Suyuqlik:&amp;lt;/b&amp;gt; zarrachalar yaqin, lekin bir-biriga nisbatan siljiy oladi.&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Gaz:&amp;lt;/b&amp;gt; zarrachalar uzoq va tartibsiz harakat qiladi.&amp;lt;/div&amp;gt;
&amp;lt;/div&amp;gt;&amp;lt;/section&amp;gt;

&amp;lt;section&amp;gt;&amp;lt;h2&amp;gt;2. Molekulalarning doimiy va tartibsiz harakati&amp;lt;/h2&amp;gt;
&amp;lt;p&amp;gt;Molekulalar doimo tartibsiz harakatda bo‘ladi. Temperatura oshsa, ularning o‘rtacha kinetik energiyasi va harakat tezligi ortadi.&amp;lt;/p&amp;gt;
&amp;lt;canvas id=&amp;quot;sim&amp;quot;&amp;gt;&amp;lt;/canvas&amp;gt;
&amp;lt;div class=&amp;quot;controls&amp;quot;&amp;gt;
&amp;lt;button onclick=&amp;quot;running=!running&amp;quot;&amp;gt;▶/Ⅱ Play/Pause&amp;lt;/button&amp;gt;
&amp;lt;button onclick=&amp;quot;reset()&amp;quot;&amp;gt;↻ Reset&amp;lt;/button&amp;gt;
&amp;lt;label&amp;gt;Holat:
&amp;lt;select id=&amp;quot;state&amp;quot; onchange=&amp;quot;reset()&amp;quot;&amp;gt;&amp;lt;option value=&amp;quot;solid&amp;quot;&amp;gt;Qattiq&amp;lt;/option&amp;gt;&amp;lt;option value=&amp;quot;liquid&amp;quot;&amp;gt;Suyuq&amp;lt;/option&amp;gt;&amp;lt;option value=&amp;quot;gas&amp;quot;&amp;gt;Gaz&amp;lt;/option&amp;gt;&amp;lt;/select&amp;gt;&amp;lt;/label&amp;gt;
&amp;lt;label&amp;gt;Temperatura &amp;lt;input id=&amp;quot;temp&amp;quot; type=&amp;quot;range&amp;quot; min=&amp;quot;1&amp;quot; max=&amp;quot;100&amp;quot; value=&amp;quot;50&amp;quot;&amp;gt;&amp;lt;/label&amp;gt;
&amp;lt;/div&amp;gt;
&amp;lt;p id=&amp;quot;info&amp;quot;&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/section&amp;gt;

&amp;lt;section&amp;gt;&amp;lt;h2&amp;gt;3. Molekulyar-kinetik nazariyaning 3 qoidasi&amp;lt;/h2&amp;gt;
&amp;lt;div class=&amp;quot;grid&amp;quot;&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;b&amp;gt;1.&amp;lt;/b&amp;gt; Barcha moddalar juda kichik zarrachalardan tashkil topgan.&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;b&amp;gt;2.&amp;lt;/b&amp;gt; Zarrachalar doimo tartibsiz harakatda bo‘ladi.&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;b&amp;gt;3.&amp;lt;/b&amp;gt; Zarrachalar o‘zaro ta’sirlashadi: tortishish va itarilish mavjud.&amp;lt;/div&amp;gt;
&amp;lt;/div&amp;gt;&amp;lt;/section&amp;gt;

&amp;lt;section&amp;gt;&amp;lt;h2&amp;gt;🔬 Tajribalar va hodisalar&amp;lt;/h2&amp;gt;
&amp;lt;div class=&amp;quot;grid&amp;quot;&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Diffuziya&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Atir hidining xonaga tarqalishi yoki bo‘yoqning suvda yoyilishi zarrachalarning harakatini ko‘rsatadi.&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Broun harakati&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Suyuqlik yoki gazdagi juda mayda zarrachalarning tartibsiz harakati molekulalar bilan to‘qnashuvlar natijasidir.&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Gaz bosimi&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;Gaz molekulalarining idish devoriga urilishi natijasida bosim hosil bo‘ladi.&amp;lt;/div&amp;gt;
&amp;lt;/div&amp;gt;&amp;lt;/section&amp;gt;

&amp;lt;section&amp;gt;&amp;lt;h2&amp;gt;🧪 Oddiy amaliy tajriba&amp;lt;/h2&amp;gt;
&amp;lt;p&amp;gt;Ikki stakanga sovuq va iliq suv quying. Har biriga bir tomchi oziq-ovqat bo‘yog‘i qo‘shing. Iliq suvda rang tezroq tarqalishini kuzating.&amp;lt;/p&amp;gt;
&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Xulosa:&amp;lt;/b&amp;gt; temperatura oshishi zarrachalarning tartibsiz harakatini tezlashtiradi.&amp;lt;/p&amp;gt;
&amp;lt;/section&amp;gt;

&amp;lt;section&amp;gt;&amp;lt;h2&amp;gt;❓ Mustahkamlash savollari&amp;lt;/h2&amp;gt;
&amp;lt;ol&amp;gt;
&amp;lt;li&amp;gt;Modda nimalardan tashkil topgan?&amp;lt;/li&amp;gt;
&amp;lt;li&amp;gt;Molekulalar qanday harakat qiladi?&amp;lt;/li&amp;gt;
&amp;lt;li&amp;gt;Temperatura oshganda molekulalar harakati qanday o‘zgaradi?&amp;lt;/li&amp;gt;
&amp;lt;li&amp;gt;Diffuziya nima?&amp;lt;/li&amp;gt;
&amp;lt;li&amp;gt;Gaz bosimi qanday hosil bo‘ladi?&amp;lt;/li&amp;gt;
&amp;lt;/ol&amp;gt;&amp;lt;/section&amp;gt;

&amp;lt;section&amp;gt;&amp;lt;h2&amp;gt;📝 Test&amp;lt;/h2&amp;gt;
&amp;lt;div id=&amp;quot;tests&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;button onclick=&amp;quot;check()&amp;quot;&amp;gt;Javoblarni tekshirish&amp;lt;/button&amp;gt;
&amp;lt;p id=&amp;quot;result&amp;quot;&amp;gt;&amp;lt;/p&amp;gt;&amp;lt;/section&amp;gt;

&amp;lt;section&amp;gt;&amp;lt;h2&amp;gt;📌 Bugun nimani o‘rgandik?&amp;lt;/h2&amp;gt;
&amp;lt;p&amp;gt;Moddalar mayda zarrachalardan tashkil topgan. Zarrachalar doimo tartibsiz harakat qiladi va o‘zaro ta’sirlashadi. Diffuziya, Broun harakati va gaz bosimi molekulyar harakatning tajribaviy dalillaridir.&amp;lt;/p&amp;gt;
&amp;lt;/section&amp;gt;
&amp;lt;/main&amp;gt;

&amp;lt;script&amp;gt;
const c=document.getElementById(&amp;#x27;sim&amp;#x27;),x=c.getContext(&amp;#x27;2d&amp;#x27;);
let W=900,H=280, p=[],running=true;
function reset(){
 c.width=W;c.height=H;p=[];
 let s=document.getElementById(&amp;#x27;state&amp;#x27;).value,n=s===&amp;#x27;solid&amp;#x27;?55:s===&amp;#x27;liquid&amp;#x27;?50:35;
 for(let i=0;i&amp;lt;n;i++){
  let a=Math.random()*Math.PI*2;
  p.push({x:s===&amp;#x27;solid&amp;#x27;?80+(i%11)*55:Math.random()*W,y:s===&amp;#x27;solid&amp;#x27;?45+Math.floor(i/11)*40:Math.random()*H,
  vx:Math.cos(a),vy:Math.sin(a)});
 }
 draw();
}
function draw(){
 x.clearRect(0,0,W,H);
 let s=document.getElementById(&amp;#x27;state&amp;#x27;).value,t=+document.getElementById(&amp;#x27;temp&amp;#x27;).value;
 let speed=.25+t/35;
 p.forEach((q,i)=&amp;gt;{
  if(running){
   if(s===&amp;#x27;solid&amp;#x27;){q.x+=q.vx*speed*.35;q.y+=q.vy*speed*.35;
    if(q.x&amp;lt;50||q.x&amp;gt;W-50)q.vx*=-1;if(q.y&amp;lt;30||q.y&amp;gt;H-30)q.vy*=-1;}
   else {q.x+=q.vx*speed;q.y+=q.vy*speed;
    if(q.x&amp;lt;8||q.x&amp;gt;W-8)q.vx*=-1;if(q.y&amp;lt;8||q.y&amp;gt;H-8)q.vy*=-1;}
  }
  x.beginPath();x.arc(q.x,q.y,6,0,7);x.fillStyle=&amp;#x27;#66d9ff&amp;#x27;;x.fill();
 });
 document.getElementById(&amp;#x27;info&amp;#x27;).textContent=`Temperatura: ${t}%. Zarrachalar harakati: ${t&amp;gt;65?&amp;#x27;tez&amp;#x27;:&amp;#x27;o‘rtacha&amp;#x27;}.`;
 requestAnimationFrame(draw);
}
const qs=[
[&amp;#x27;Modda nimadan tashkil topgan?&amp;#x27;,[&amp;#x27;Molekulalardan&amp;#x27;,&amp;#x27;Faqat suvdan&amp;#x27;,&amp;#x27;Faqat havodan&amp;#x27;,&amp;#x27;Issiqlikdan&amp;#x27;],0],
[&amp;#x27;Temperatura oshsa molekulalar harakati qanday bo‘ladi?&amp;#x27;,[&amp;#x27;Sekinlashadi&amp;#x27;,&amp;#x27;Tezlashadi&amp;#x27;,&amp;#x27;To‘xtaydi&amp;#x27;,&amp;#x27;O‘zgarmaydi&amp;#x27;],1],
[&amp;#x27;Diffuziya nimani ko‘rsatadi?&amp;#x27;,[&amp;#x27;Zarrachalar harakatini&amp;#x27;,&amp;#x27;Jism massasini&amp;#x27;,&amp;#x27;Rangni&amp;#x27;,&amp;#x27;Og‘irlikni&amp;#x27;],0],
[&amp;#x27;Gaz bosimi nimadan hosil bo‘ladi?&amp;#x27;,[&amp;#x27;Molekulalarning devorga urilishidan&amp;#x27;,&amp;#x27;Yorug‘likdan&amp;#x27;,&amp;#x27;Rangdan&amp;#x27;,&amp;#x27;Suvdan&amp;#x27;],0],
[&amp;#x27;Molekulyar-kinetik nazariyada nechta asosiy qoida bor?&amp;#x27;,[&amp;#x27;1&amp;#x27;,&amp;#x27;2&amp;#x27;,&amp;#x27;3&amp;#x27;,&amp;#x27;5&amp;#x27;],2]
];
document.getElementById(&amp;#x27;tests&amp;#x27;).innerHTML=qs.map((q,i)=&amp;gt;`&amp;lt;div class=&amp;quot;question&amp;quot;&amp;gt;&amp;lt;b&amp;gt;${i+1}. ${q[0]}&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;`+
q[1].map((a,j)=&amp;gt;`&amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;radio&amp;quot; name=&amp;quot;q${i}&amp;quot; value=&amp;quot;${j}&amp;quot;&amp;gt; ${a}&amp;lt;/label&amp;gt;&amp;lt;br&amp;gt;`).join(&amp;#x27;&amp;#x27;)+&amp;#x27;&amp;lt;/div&amp;gt;&amp;#x27;).join(&amp;#x27;&amp;#x27;);
function check(){
 let n=0;qs.forEach((q,i)=&amp;gt;{let a=document.querySelector(`input[name=q${i}]:checked`);if(a&amp;amp;&amp;amp;+a.value===q[2])n++});
 document.getElementById(&amp;#x27;result&amp;#x27;).innerHTML=`Natija: &amp;lt;b&amp;gt;${n}/5&amp;lt;/b&amp;gt;`;
}
reset();
&amp;lt;/script&amp;gt;

            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .quiz-option:hover {
            background: #e2e8f0;
        }

        .correct { background-color: #d1fae5 !important; border-color: #34d399 !important; }
        .wrong { background-color: #fee2e2 !important; border-color: #f87171 !important; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover { background: #1d4ed8; }

        input[type=&amp;quot;number&amp;quot;], select {
            padding: 8px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            margin-right: 10px;
            font-size: 1rem;
        }
    &amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;
&amp;lt;body&amp;gt;

&amp;lt;header&amp;gt;
    &amp;lt;h1&amp;gt;2-Mavzu: Molekulalarning massasi va o&amp;#x27;lchami&amp;lt;/h1&amp;gt;
    &amp;lt;p&amp;gt;9-sinf Fizika fani bo&amp;#x27;yicha interaktiv mukammal raqamli darslik&amp;lt;/p&amp;gt;
&amp;lt;/header&amp;gt;

&amp;lt;div class=&amp;quot;container&amp;quot;&amp;gt;

    &amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;
        &amp;lt;h2&amp;gt;1. Molekulalar va ularning o&amp;#x27;lchami&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;Molekulalar nihoyatda kichik zarrachalardir. Ularning o&amp;#x27;lchami o&amp;#x27;rtacha &amp;lt;b&amp;gt;10&amp;lt;sup&amp;gt;-10&amp;lt;/sup&amp;gt; metr&amp;lt;/b&amp;gt; (1 angstrem) atrofida bo&amp;#x27;ladi. Quyidagi slayderni o&amp;#x27;ngga surib, makrodunyodan mikrodunyoga sayohat qiling:&amp;lt;/p&amp;gt;
        
        &amp;lt;div id=&amp;quot;zoom-container&amp;quot;&amp;gt;
            &amp;lt;input type=&amp;quot;range&amp;quot; id=&amp;quot;zoom-range&amp;quot; min=&amp;quot;1&amp;quot; max=&amp;quot;100&amp;quot; value=&amp;quot;1&amp;quot; style=&amp;quot;width: 80%;&amp;quot;&amp;gt;
            &amp;lt;div id=&amp;quot;zoom-label&amp;quot;&amp;gt;Hozirgi ko&amp;#x27;rinish: Oddiy suv tomchisi (Makrodunyo)&amp;lt;/div&amp;gt;
            &amp;lt;div class=&amp;quot;zoom-view&amp;quot;&amp;gt;
                &amp;lt;div id=&amp;quot;visual-object&amp;quot; style=&amp;quot;width: 150px; height: 150px; background: #3b82f6; border-radius: 50%;&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
            &amp;lt;/div&amp;gt;
        &amp;lt;/div&amp;gt;
    &amp;lt;/div&amp;gt;

    &amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;
        &amp;lt;h2&amp;gt;2. Molekulalarning massasi (Laboratoriya)&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;Molekulalar o&amp;#x27;ta kichik bo&amp;#x27;lgani uchun ularning absolyut massasi ham juda kichik (masalan, suv molekulasi ≈ 3·10&amp;lt;sup&amp;gt;-26&amp;lt;/sup&amp;gt; kg). Virtual tarozida moddalarni tanlab tortib ko&amp;#x27;ring:&amp;lt;/p&amp;gt;
        
        &amp;lt;div style=&amp;quot;margin-bottom: 15px;&amp;quot;&amp;gt;
            &amp;lt;label&amp;gt;Moddani tanlang: &amp;lt;/label&amp;gt;
            &amp;lt;select id=&amp;quot;substance-select&amp;quot;&amp;gt;
                &amp;lt;option value=&amp;quot;water&amp;quot;&amp;gt;Suv molekulasi (H₂O)&amp;lt;/option&amp;gt;
                &amp;lt;option value=&amp;quot;oxygen&amp;quot;&amp;gt;Kislorod molekulasi (O₂)&amp;lt;/option&amp;gt;
                &amp;lt;option value=&amp;quot;hydrogen&amp;quot;&amp;gt;Vodorod atomi (H)&amp;lt;/option&amp;gt;
            &amp;lt;/select&amp;gt;
        &amp;lt;/div&amp;gt;

        &amp;lt;div class=&amp;quot;scale-container&amp;quot;&amp;gt;
            &amp;lt;div&amp;gt;⚖️ Virtual Tarozi&amp;lt;/div&amp;gt;
            &amp;lt;div id=&amp;quot;scale-beam&amp;quot; class=&amp;quot;balance-beam&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
            &amp;lt;div id=&amp;quot;mass-result&amp;quot;&amp;gt;Absolyut massa: &amp;lt;b&amp;gt;2.99 × 10&amp;lt;sup&amp;gt;-26&amp;lt;/sup&amp;gt; kg&amp;lt;/b&amp;gt;&amp;lt;/div&amp;gt;
        &amp;lt;/div&amp;gt;
    &amp;lt;/div&amp;gt;

    &amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;
        &amp;lt;h2&amp;gt;3. Nisbiy molekulyar massa va amaliy topshiriq&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;Nisbiy molekulyar massa (M&amp;lt;sub&amp;gt;r&amp;lt;/sub&amp;gt;) — modda molekulasi massasining uglerod atomi massasi 1/12 qismiga nisbatidir. Quyidagi kalkulyatorda modda miqdoriga ko&amp;#x27;ra molekulalar sonini hisoblang:&amp;lt;/p&amp;gt;
        
        &amp;lt;div style=&amp;quot;background: #f8fafc; padding: 15px; border-radius: 6px;&amp;quot;&amp;gt;
            &amp;lt;h4&amp;gt;Formulalarni amalda tekshirish:&amp;lt;/h4&amp;gt;
            &amp;lt;input type=&amp;quot;number&amp;quot; id=&amp;quot;moles-input&amp;quot; placeholder=&amp;quot;Modda miqdori (mol)&amp;quot; value=&amp;quot;1&amp;quot; min=&amp;quot;0&amp;quot;&amp;gt; mol
            &amp;lt;button class=&amp;quot;btn&amp;quot; onclick=&amp;quot;calculateParticles()&amp;quot;&amp;gt;Hisoblash&amp;lt;/button&amp;gt;
            &amp;lt;p id=&amp;quot;calc-result&amp;quot; style=&amp;quot;margin-top: 15px; font-weight: bold; color: var(--success);&amp;quot;&amp;gt;&amp;lt;/p&amp;gt;
        &amp;lt;/div&amp;gt;
    &amp;lt;/div&amp;gt;

    &amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;
        &amp;lt;h2&amp;gt;🧠 Bilimni tekshirish (Interaktiv Test)&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;Mavzuni qanchalik yaxshi o&amp;#x27;zlashtirganingizni tekshirib ko&amp;#x27;ring. To&amp;#x27;g&amp;#x27;ri javobni bosing:&amp;lt;/p&amp;gt;
        
        &amp;lt;div id=&amp;quot;quiz-block&amp;quot;&amp;gt;
            &amp;lt;h4 id=&amp;quot;question-text&amp;quot;&amp;gt;Savol: Molekulalarning o&amp;#x27;rtacha o&amp;#x27;lchami qanchaga teng?&amp;lt;/h4&amp;gt;
            &amp;lt;button class=&amp;quot;quiz-option&amp;quot; onclick=&amp;quot;checkAnswer(this, false)&amp;quot;&amp;gt;A) 10&amp;lt;sup&amp;gt;-5&amp;lt;/sup&amp;gt; metr&amp;lt;/button&amp;gt;
            &amp;lt;button class=&amp;quot;quiz-option&amp;quot; onclick=&amp;quot;checkAnswer(this, true)&amp;quot;&amp;gt;B) 10&amp;lt;sup&amp;gt;-10&amp;lt;/sup&amp;gt; metr&amp;lt;/button&amp;gt;
            &amp;lt;button class=&amp;quot;quiz-option&amp;quot; onclick=&amp;quot;checkAnswer(this, false)&amp;quot;&amp;gt;C) 10&amp;lt;sup&amp;gt;-20&amp;lt;/sup&amp;gt; metr&amp;lt;/button&amp;gt;
        &amp;lt;/div&amp;gt;
        &amp;lt;p id=&amp;quot;quiz-feedback&amp;quot; style=&amp;quot;font-weight: bold; margin-top: 10px;&amp;quot;&amp;gt;&amp;lt;/p&amp;gt;
    &amp;lt;/div&amp;gt;

    &amp;lt;div class=&amp;quot;card&amp;quot; style=&amp;quot;border-left-color: #eab308;&amp;quot;&amp;gt;
        &amp;lt;h2&amp;gt;🏠 Uyga vazifa va Mustaqil ish&amp;lt;/h2&amp;gt;
        &amp;lt;p&amp;gt;Quyidagi topshiriqni daftaringizga bajaring va yakuniy sonli javobni tekshirish uchun bosing:&amp;lt;/p&amp;gt;
        &amp;lt;div style=&amp;quot;background: #fef08a; padding: 15px; border-radius: 8px; color: #854d0e;&amp;quot;&amp;gt;
            &amp;lt;b&amp;gt;Masala:&amp;lt;/b&amp;gt; 36 gramm suvda (H₂O) qancha molekula bor? (Suvning molyar massasi M = 18 g/mol).
        &amp;lt;/div&amp;gt;
        &amp;lt;p style=&amp;quot;margin-top: 15px;&amp;quot;&amp;gt;
            Siz topgan javob (N × 10&amp;lt;sup&amp;gt;23&amp;lt;/sup&amp;gt; dona): 
            &amp;lt;input type=&amp;quot;number&amp;quot; id=&amp;quot;homework-input&amp;quot; placeholder=&amp;quot;Masalan: 12&amp;quot;&amp;gt; × 10&amp;lt;sup&amp;gt;23&amp;lt;/sup&amp;gt;
            &amp;lt;button class=&amp;quot;btn&amp;quot; style=&amp;quot;background: #eab308; color: black;&amp;quot; onclick=&amp;quot;checkHomework()&amp;quot;&amp;gt;Tekshirish&amp;lt;/button&amp;gt;
        &amp;lt;/p&amp;gt;
        &amp;lt;p id=&amp;quot;homework-feedback&amp;quot; style=&amp;quot;font-weight: bold;&amp;quot;&amp;gt;&amp;lt;/p&amp;gt;
    &amp;lt;/div&amp;gt;

&amp;lt;/div&amp;gt;

&amp;lt;script&amp;gt;
    const slider = document.getElementById(&amp;#x27;zoom-range&amp;#x27;);
    const label = document.getElementById(&amp;#x27;zoom-label&amp;#x27;);
    const obj = document.getElementById(&amp;#x27;visual-object&amp;#x27;);

    slider.addEventListener(&amp;#x27;input&amp;#x27;, (e) =&amp;gt; {
        let val = e.target.value;
        if(val &amp;lt; 40) {
            label.innerText = &amp;quot;Hozirgi ko&amp;#x27;rinish: Oddiy suv tomchisi (Makrodunyo)&amp;quot;;
            obj.style.borderRadius = &amp;quot;50%&amp;quot;;
            obj.style.background = &amp;quot;#3b82f6&amp;quot;;
            obj.style.transform = `scale(${1 - val/100})`;
        } else if (val &amp;gt;= 40 &amp;amp;&amp;amp; val &amp;lt; 80) {
            label.innerText = &amp;quot;Yaqinlashmoqda: Mikroskopik mikro-tomchi&amp;quot;;
            obj.style.background = &amp;quot;#60a5fa&amp;quot;;
            obj.style.borderRadius = &amp;quot;40%&amp;quot;;
        } else {
            label.innerText = &amp;quot;Mikrodunyo: Suv (H₂O) molekulasi shakllandi! (10⁻¹⁰ m)&amp;quot;;
            obj.style.background = &amp;quot;#ef4444&amp;quot;;
            obj.style.borderRadius = &amp;quot;50px&amp;quot;;
            obj.style.boxShadow = &amp;quot;0 0 20px rgba(239,68,68,0.8)&amp;quot;;
        }
    });

    const select = document.getElementById(&amp;#x27;substance-select&amp;#x27;);
    const beam = document.getElementById(&amp;#x27;scale-beam&amp;#x27;);
    const massRes = document.getElementById(&amp;#x27;mass-result&amp;#x27;);

    select.addEventListener(&amp;#x27;change&amp;#x27;, (e) =&amp;gt; {
        let val = e.target.value;
        if(val === &amp;#x27;water&amp;#x27;) {
            beam.style.transform = &amp;quot;rotate(3deg)&amp;quot;;
            massRes.innerHTML = &amp;quot;Absolyut massa: &amp;lt;b&amp;gt;2.99 × 10&amp;lt;sup&amp;gt;-26&amp;lt;/sup&amp;gt; kg&amp;lt;/b&amp;gt; | Nisbiy massa: 18 a.m.b&amp;quot;;
        } else if(val === &amp;#x27;oxygen&amp;#x27;) {
            beam.style.transform = &amp;quot;rotate(7deg)&amp;quot;;
            massRes.innerHTML = &amp;quot;Absolyut massa: &amp;lt;b&amp;gt;5.31 × 10&amp;lt;sup&amp;gt;-26&amp;lt;/sup&amp;gt; kg&amp;lt;/b&amp;gt; | Nisbiy massa: 32 a.m.b&amp;quot;;
        } else {
            beam.style.transform = &amp;quot;rotate(-5deg)&amp;quot;;
            massRes.innerHTML = &amp;quot;Absolyut massa: &amp;lt;b&amp;gt;1.67 × 10&amp;lt;sup&amp;gt;-27&amp;lt;/sup&amp;gt; kg&amp;lt;/b&amp;gt; | Nisbiy massa: 1 a.m.b&amp;quot;;
        }
    });

    function calculateParticles() {
        let moles = document.getElementById(&amp;#x27;moles-input&amp;#x27;).value;
        let Na = 6.02;
        let result = moles * Na;
        document.getElementById(&amp;#x27;calc-result&amp;#x27;).innerText = `Javob: Kiritilgan modda miqdorida jami ${result.toFixed(2)} × 10²³ dona molekula mavjud!`;
    }

    function checkAnswer(button, isCorrect) {
        let options = document.querySelectorAll(&amp;#x27;.quiz-option&amp;#x27;);
        options.forEach(opt =&amp;gt; opt.disabled = true);

        if(isCorrect) {
            button.classList.add(&amp;#x27;correct&amp;#x27;);
            document.getElementById(&amp;#x27;quiz-feedback&amp;#x27;).innerText = &amp;quot;🎉 To&amp;#x27;g&amp;#x27;ri! Barakalla. Molekulalar aynan 10⁻¹⁰ metr tartibiga ega.&amp;quot;;
            document.getElementById(&amp;#x27;quiz-feedback&amp;#x27;).style.color = &amp;quot;var(--success)&amp;quot;;
        } else {
            button.classList.add(&amp;#x27;wrong&amp;#x27;);
            document.getElementById(&amp;#x27;quiz-feedback&amp;#x27;).innerText = &amp;quot;❌ Noto&amp;#x27;g&amp;#x27;ri. Mavzuni qayta o&amp;#x27;qib ko&amp;#x27;ring.&amp;quot;;
            document.getElementById(&amp;#x27;quiz-feedback&amp;#x27;).style.color = &amp;quot;var(--danger)&amp;quot;;
        }
    }

    function checkHomework() {
        let userAns = document.getElementById(&amp;#x27;homework-input&amp;#x27;).value;
        let feedback = document.getElementById(&amp;#x27;homework-feedback&amp;#x27;);
        if(userAns == 12 || userAns == 12.04) {
            feedback.innerText = &amp;quot;⭐ Ajoyib! Javobingiz mutloqo to&amp;#x27;g&amp;#x27;ri (12 × 10²³ dona).&amp;quot;;
            feedback.style.color = &amp;quot;var(--success)&amp;quot;;
        } else {
            feedback.innerText = &amp;quot;⚠️ Noto&amp;#x27;g&amp;#x27;ri. Yordam: Dastlab n = m/M dan modda miqdorini toping, keyin uni Avogadro soniga ko&amp;#x27;paytiring.&amp;quot;;
            feedback.style.color = &amp;quot;var(--danger)&amp;quot;;
        }
    }
&amp;lt;/script&amp;gt;

&amp;lt;body&amp;gt;
&amp;lt;header&amp;gt;
&amp;lt;h1&amp;gt;🌡️ Temperatura va uni o‘lchash&amp;lt;/h1&amp;gt;
&amp;lt;p class=&amp;quot;sub&amp;quot;&amp;gt;9-sinf fizika • Interaktiv animatsiyalar va simulyatsiyalar&amp;lt;/p&amp;gt;

&amp;lt;button onclick=&amp;quot;show(&amp;#x27;quiz&amp;#x27;)&amp;quot;&amp;gt;Mini-test&amp;lt;/button&amp;gt;

&amp;lt;main&amp;gt;
&amp;lt;section id=&amp;quot;plan&amp;quot; class=&amp;quot;card&amp;quot;&amp;gt;
&amp;lt;h2&amp;gt;📚 Dars rejasi&amp;lt;/h2&amp;gt;
&amp;lt;div class=&amp;quot;grid&amp;quot;&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;h3&amp;gt;1-reja. Temperatura tushunchasi&amp;lt;/h3&amp;gt;&amp;lt;p&amp;gt;Temperatura nima? Molekulalarning tartibsiz harakati va temperatura bilan zarrachalar harakati orasidagi bog‘lanishni animatsiya orqali o‘rganish.&amp;lt;/p&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;h3&amp;gt;2-reja. Temperaturani o‘lchash&amp;lt;/h3&amp;gt;&amp;lt;p&amp;gt;Termometrning ishlash prinsipi, termometr shkalasi hamda Selsiy, Kelvin va Farengeyt shkalalarini interaktiv simulyatsiya yordamida o‘rganish.&amp;lt;/p&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;card&amp;quot;&amp;gt;&amp;lt;h3&amp;gt;3-reja. Qizish va sovish jarayonlari&amp;lt;/h3&amp;gt;&amp;lt;p&amp;gt;Jismlarning qizishi va sovishi, issiqlik almashinuvi hamda temperatura o‘zgarishini grafik va animatsiya orqali kuzatish.&amp;lt;/p&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;note&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Dars maqsadi:&amp;lt;/b&amp;gt; temperatura tushunchasi, uni o‘lchash usullari va temperatura o‘zgarishlarini interaktiv simulyatsiyalar yordamida tushuntirish.&amp;lt;/div&amp;gt;
&amp;lt;/section&amp;gt;
&amp;lt;section id=&amp;quot;intro&amp;quot; class=&amp;quot;card&amp;quot;&amp;gt;
&amp;lt;h2&amp;gt;1. Temperatura nima?&amp;lt;/h2&amp;gt;
&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Temperatura&amp;lt;/b&amp;gt; — jismning qanchalik issiq yoki sovuqligini tavsiflovchi fizik kattalik. Modda zarrachalari doimo tartibsiz harakatda bo‘ladi.&amp;lt;/p&amp;gt;
&amp;lt;div class=&amp;quot;grid&amp;quot;&amp;gt;
&amp;lt;div&amp;gt;&amp;lt;canvas id=&amp;quot;introCanvas&amp;quot;&amp;gt;&amp;lt;/canvas&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;div&amp;gt;
&amp;lt;p&amp;gt;🔵 &amp;lt;b&amp;gt;Past temperatura:&amp;lt;/b&amp;gt; zarrachalar sekinroq harakat qiladi.&amp;lt;/p&amp;gt;

&amp;lt;/div&amp;gt;
&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Vazifa:&amp;lt;/b&amp;gt; slayder yordamida 0°C, 20°C, 50°C va 100°C qiymatlarini toping.&amp;lt;/p&amp;gt;

&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Ideal gaz&amp;lt;/b&amp;gt; — molekulalarining o‘lchami ular orasidagi masofaga nisbatan juda kichik bo‘lgan va molekulalar orasidagi o‘zaro ta’sir to‘qnashuvlardan tashqari hisobga olinmaydigan gaz modelidir.&amp;lt;/p&amp;gt;

&amp;lt;ul&amp;gt;
&amp;lt;li&amp;gt;Molekulalar juda kichik moddiy nuqtalar deb qaraladi.&amp;lt;/li&amp;gt;

&amp;lt;/ul&amp;gt;

&amp;lt;h3 style=&amp;quot;color:#fff&amp;quot;&amp;gt;🔬 Simulyatsiya: gaz molekulalarining tartibsiz harakati&amp;lt;/h3&amp;gt;
&amp;lt;p style=&amp;quot;text-align:center&amp;quot;&amp;gt;Harorat oshirilsa, molekulalar tezroq harakat qiladi.&amp;lt;/p&amp;gt;
&amp;lt;canvas id=&amp;quot;gas&amp;quot; width=&amp;quot;760&amp;quot; height=&amp;quot;300&amp;quot;&amp;gt;&amp;lt;/canvas&amp;gt;
&amp;lt;div class=&amp;quot;controls&amp;quot;&amp;gt;
&amp;lt;button onclick=&amp;quot;heat()&amp;quot;&amp;gt;🔥 Haroratni oshirish&amp;lt;/button&amp;gt;
&amp;lt;button onclick=&amp;quot;cool()&amp;quot;&amp;gt;❄️ Sovitish&amp;lt;/button&amp;gt;
&amp;lt;button class=&amp;quot;alt&amp;quot; onclick=&amp;quot;resetGas()&amp;quot;&amp;gt;↻ Boshlang‘ich holat&amp;lt;/button&amp;gt;
&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;readout&amp;quot;&amp;gt;
&amp;lt;div&amp;gt;Harorat&amp;lt;br&amp;gt;&amp;lt;span class=&amp;quot;value&amp;quot; id=&amp;quot;t1&amp;quot;&amp;gt;20 °C&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;div&amp;gt;Tezlik&amp;lt;br&amp;gt;&amp;lt;span class=&amp;quot;value&amp;quot; id=&amp;quot;s1&amp;quot;&amp;gt;2.0&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;div&amp;gt;Molekulalar&amp;lt;br&amp;gt;&amp;lt;span class=&amp;quot;value&amp;quot;&amp;gt;40 ta&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;/div&amp;gt;
&amp;lt;/div&amp;gt;

&amp;lt;div class=&amp;quot;note&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Xulosa:&amp;lt;/b&amp;gt; Harorat oshishi molekulalarning o‘rtacha kinetik energiyasi va harakat tezligining ortishi bilan bog‘liq.&amp;lt;/div&amp;gt;
&amp;lt;/section&amp;gt;

&amp;lt;!-- 2-REJA --&amp;gt;
&amp;lt;section class=&amp;quot;card&amp;quot;&amp;gt;
&amp;lt;span class=&amp;quot;badge&amp;quot;&amp;gt;2-REJA&amp;lt;/span&amp;gt;
&amp;lt;h2&amp;gt;Ideal gazning holat tenglamasi va gaz qonunlari&amp;lt;/h2&amp;gt;

&amp;lt;p&amp;gt;Ideal gazning holati &amp;lt;b&amp;gt;bosim (p)&amp;lt;/b&amp;gt;, &amp;lt;b&amp;gt;hajm (V)&amp;lt;/b&amp;gt; va &amp;lt;b&amp;gt;absolyut harorat (T)&amp;lt;/b&amp;gt; bilan tavsiflanadi.&amp;lt;/p&amp;gt;
&amp;lt;div class=&amp;quot;formula&amp;quot;&amp;gt;pV = (m/M)RT&amp;lt;/div&amp;gt;

&amp;lt;h3&amp;gt;Asosiy gaz qonunlari&amp;lt;/h3&amp;gt;
&amp;lt;table&amp;gt;
&amp;lt;tr&amp;gt;&amp;lt;th&amp;gt;Qonun&amp;lt;/th&amp;gt;&amp;lt;th&amp;gt;O‘zgarmas kattalik&amp;lt;/th&amp;gt;&amp;lt;th&amp;gt;Tenglama&amp;lt;/th&amp;gt;&amp;lt;/tr&amp;gt;
&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;Boyl-Mariott&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;T = const&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;p₁V₁ = p₂V₂&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;
&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;Gey-Lyussak&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;p = const&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;V₁/T₁ = V₂/T₂&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;
&amp;lt;tr&amp;gt;&amp;lt;td&amp;gt;Sharl&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;V = const&amp;lt;/td&amp;gt;&amp;lt;td&amp;gt;p₁/T₁ = p₂/T₂&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;
&amp;lt;/table&amp;gt;

&amp;lt;div class=&amp;quot;sim&amp;quot;&amp;gt;
&amp;lt;h3 style=&amp;quot;color:#fff&amp;quot;&amp;gt;🎛 Simulyatsiya: Izotermik jarayon (T = const)&amp;lt;/h3&amp;gt;
&amp;lt;p&amp;gt;Hajmni o‘zgartiring. Harorat o‘zgarmas bo‘lganda hajm kamayishi bilan bosim ortadi.&amp;lt;/p&amp;gt;
&amp;lt;label&amp;gt;Hajm: &amp;lt;b id=&amp;quot;v2&amp;quot;&amp;gt;100%&amp;lt;/b&amp;gt;&amp;lt;/label&amp;gt;
&amp;lt;input id=&amp;quot;vol&amp;quot; type=&amp;quot;range&amp;quot; min=&amp;quot;50&amp;quot; max=&amp;quot;150&amp;quot; value=&amp;quot;100&amp;quot;&amp;gt;
&amp;lt;div class=&amp;quot;readout&amp;quot;&amp;gt;
&amp;lt;div&amp;gt;Bosim&amp;lt;br&amp;gt;&amp;lt;span class=&amp;quot;value&amp;quot; id=&amp;quot;p2&amp;quot;&amp;gt;1.00 atm&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;div&amp;gt;Harorat&amp;lt;br&amp;gt;&amp;lt;span class=&amp;quot;value&amp;quot;&amp;gt;const&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;/div&amp;gt;
&amp;lt;canvas id=&amp;quot;piston&amp;quot; width=&amp;quot;760&amp;quot; height=&amp;quot;220&amp;quot;&amp;gt;&amp;lt;/canvas&amp;gt;
&amp;lt;/div&amp;gt;

&amp;lt;div class=&amp;quot;sim&amp;quot;&amp;gt;
&amp;lt;h3 style=&amp;quot;color:#fff&amp;quot;&amp;gt;🌡 Simulyatsiya: Harorat va bosim (V = const)&amp;lt;/h3&amp;gt;
&amp;lt;p&amp;gt;Idish hajmi o‘zgarmaydi. Harorat oshirilganda bosim ortadi.&amp;lt;/p&amp;gt;
&amp;lt;label&amp;gt;Harorat: &amp;lt;b id=&amp;quot;temp3&amp;quot;&amp;gt;300 K&amp;lt;/b&amp;gt;&amp;lt;/label&amp;gt;
&amp;lt;input id=&amp;quot;tempRange&amp;quot; type=&amp;quot;range&amp;quot; min=&amp;quot;200&amp;quot; max=&amp;quot;600&amp;quot; value=&amp;quot;300&amp;quot;&amp;gt;
&amp;lt;div class=&amp;quot;readout&amp;quot;&amp;gt;
&amp;lt;div&amp;gt;Temperatura&amp;lt;br&amp;gt;&amp;lt;span class=&amp;quot;value&amp;quot; id=&amp;quot;tk&amp;quot;&amp;gt;300 K&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;div&amp;gt;Bosim&amp;lt;br&amp;gt;&amp;lt;span class=&amp;quot;value&amp;quot; id=&amp;quot;pk&amp;quot;&amp;gt;1.00 atm&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;/div&amp;gt;
&amp;lt;canvas id=&amp;quot;pressureCanvas&amp;quot; width=&amp;quot;760&amp;quot; height=&amp;quot;220&amp;quot;&amp;gt;&amp;lt;/canvas&amp;gt;
&amp;lt;/div&amp;gt;
&amp;lt;/section&amp;gt;

&amp;lt;!-- 3-REJA --&amp;gt;
&amp;lt;section class=&amp;quot;card&amp;quot;&amp;gt;
&amp;lt;span class=&amp;quot;badge&amp;quot;&amp;gt;3-REJA&amp;lt;/span&amp;gt;
&amp;lt;h2&amp;gt;Ideal gaz qonunlarining amaliy qo‘llanilishi va masalalar&amp;lt;/h2&amp;gt;

&amp;lt;p&amp;gt;Gaz qonunlari kundalik hayotda va texnikada ko‘p uchraydi:&amp;lt;/p&amp;gt;
&amp;lt;ul&amp;gt;
&amp;lt;li&amp;gt;🚗 avtomobil shinalaridagi bosim;&amp;lt;/li&amp;gt;
&amp;lt;li&amp;gt;🔥 issiqlik dvigatellari;&amp;lt;/li&amp;gt;
&amp;lt;li&amp;gt;🧯 gaz ballonlari;&amp;lt;/li&amp;gt;
&amp;lt;li&amp;gt;☁️ meteorologik kuzatuvlar;&amp;lt;/li&amp;gt;
&amp;lt;li&amp;gt;❄️ sovutish qurilmalari va kompressorlar.&amp;lt;/li&amp;gt;
&amp;lt;/ul&amp;gt;

&amp;lt;div class=&amp;quot;sim&amp;quot;&amp;gt;
&amp;lt;h3 style=&amp;quot;color:#fff&amp;quot;&amp;gt;🚗 Amaliy simulyatsiya: shina bosimi&amp;lt;/h3&amp;gt;
&amp;lt;p&amp;gt;Harorat oshirilganda, hajm o‘zgarmas deb olsak, shina ichidagi bosim ham ortadi.&amp;lt;/p&amp;gt;
&amp;lt;label&amp;gt;Harorat: &amp;lt;b id=&amp;quot;tireTemp&amp;quot;&amp;gt;20 °C&amp;lt;/b&amp;gt;&amp;lt;/label&amp;gt;
&amp;lt;input id=&amp;quot;tire&amp;quot; type=&amp;quot;range&amp;quot; min=&amp;quot;0&amp;quot; max=&amp;quot;60&amp;quot; value=&amp;quot;20&amp;quot;&amp;gt;
&amp;lt;canvas id=&amp;quot;tireCanvas&amp;quot; width=&amp;quot;760&amp;quot; height=&amp;quot;230&amp;quot;&amp;gt;&amp;lt;/canvas&amp;gt;
&amp;lt;p style=&amp;quot;text-align:center&amp;quot;&amp;gt;Bosim: &amp;lt;span class=&amp;quot;value&amp;quot; id=&amp;quot;tirePressure&amp;quot;&amp;gt;2.00 bar&amp;lt;/span&amp;gt;&amp;lt;/p&amp;gt;
&amp;lt;/div&amp;gt;

&amp;lt;div class=&amp;quot;question&amp;quot;&amp;gt;
&amp;lt;b&amp;gt;🧮 Namuna masala&amp;lt;/b&amp;gt;
&amp;lt;p&amp;gt;O‘zgarmas haroratda hajmi 4 litr bo‘lgan gazning bosimi 200 kPa. Hajm 2 litrgacha kamaytirilsa, yangi bosim qancha bo‘ladi?&amp;lt;/p&amp;gt;
&amp;lt;div class=&amp;quot;formula&amp;quot;&amp;gt;p₁V₁ = p₂V₂&amp;lt;/div&amp;gt;
&amp;lt;p&amp;gt;p₂ = (p₁V₁)/V₂ = (200 × 4)/2 = &amp;lt;b&amp;gt;400 kPa&amp;lt;/b&amp;gt;&amp;lt;/p&amp;gt;
&amp;lt;/div&amp;gt;

&amp;lt;div class=&amp;quot;question&amp;quot;&amp;gt;
&amp;lt;b&amp;gt;💡 Interaktiv savol&amp;lt;/b&amp;gt;
&amp;lt;p&amp;gt;Gaz hajmi 2 marta kamayib, harorat o‘zgarmasa, bosim qanday o‘zgaradi?&amp;lt;/p&amp;gt;
&amp;lt;button onclick=&amp;quot;showAnswer()&amp;quot;&amp;gt;Javobni ko‘rsatish&amp;lt;/button&amp;gt;
&amp;lt;p id=&amp;quot;answer&amp;quot; class=&amp;quot;answer&amp;quot;&amp;gt;Javob: bosim 2 marta ortadi, chunki pV = const.&amp;lt;/p&amp;gt;
&amp;lt;/div&amp;gt;
&amp;lt;/section&amp;gt;

&amp;lt;footer&amp;gt;
&amp;lt;b&amp;gt;9-sinf Fizika&amp;lt;/b&amp;gt; • Ideal gaz va uning qonunlari • Interaktiv HTML5 dars
&amp;lt;/footer&amp;gt;
&amp;lt;/div&amp;gt;

&amp;lt;script&amp;gt;
/* 1-SIMULYATSIYA: MOLEKULALAR */
const gas=document.getElementById(&amp;quot;gas&amp;quot;),gx=gas.getContext(&amp;quot;2d&amp;quot;);
let particles=[],gasSpeed=2,gasTemp=20;
function makeParticles(){
 particles=[];
 for(let i=0;i&amp;lt;40;i++){
  let a=Math.random()*Math.PI*2;
  particles.push({x:20+Math.random()*720,y:20+Math.random()*260,
   vx:Math.cos(a)*gasSpeed*(.7+Math.random()*.7),
   vy:Math.sin(a)*gasSpeed*(.7+Math.random()*.7),r:4});
 }
}
makeParticles();
function gasAnimation(){
 gx.clearRect(0,0,760,300);
 gx.strokeStyle=&amp;quot;#475569&amp;quot;;gx.strokeRect(1,1,758,298);
 particles.forEach(p=&amp;gt;{
  p.x+=p.vx;p.y+=p.vy;
  if(p.x&amp;lt;5||p.x&amp;gt;755)p.vx*=-1;
  if(p.y&amp;lt;5||p.y&amp;gt;295)p.vy*=-1;
  gx.beginPath();gx.arc(p.x,p.y,p.r,0,Math.PI*2);
  gx.fillStyle=gasTemp&amp;gt;50?&amp;quot;#fb7185&amp;quot;:&amp;quot;#38bdf8&amp;quot;;gx.fill();
 });
 requestAnimationFrame(gasAnimation);
}
gasAnimation();
function changeGas(v,t){
 gasSpeed=v;gasTemp=t;
 particles.forEach(p=&amp;gt;{
  let a=Math.atan2(p.vy,p.vx),m=v*(.7+Math.random()*.7);
  p.vx=Math.cos(a)*m;p.vy=Math.sin(a)*m;
 });
 document.getElementById(&amp;quot;t1&amp;quot;).textContent=t+&amp;quot; °C&amp;quot;;
 document.getElementById(&amp;quot;s1&amp;quot;).textContent=v.toFixed(1);
}
function heat(){changeGas(5,80)}
function cool(){changeGas(1,0)}
function resetGas(){gasTemp=20;gasSpeed=2;makeParticles();changeGas(2,20)}

/* 2A: PISTON */
const vol=document.getElementById(&amp;quot;vol&amp;quot;);
function drawPiston(v){
 document.getElementById(&amp;quot;v2&amp;quot;).textContent=v+&amp;quot;%&amp;quot;;
 document.getElementById(&amp;quot;p2&amp;quot;).textContent=(100/v).toFixed(2)+&amp;quot; atm&amp;quot;;
 const c=document.getElementById(&amp;quot;piston&amp;quot;),x=c.getContext(&amp;quot;2d&amp;quot;);
 x.clearRect(0,0,760,220);
 x.strokeStyle=&amp;quot;#94a3b8&amp;quot;;x.lineWidth=5;x.strokeRect(80,35,600,130);
 let w=600*v/150,px=80+w;
 x.fillStyle=&amp;quot;#38bdf8&amp;quot;;x.fillRect(80,40,w,120);
 x.fillStyle=&amp;quot;#cbd5e1&amp;quot;;x.fillRect(px-6,25,12,150);
 x.fillStyle=&amp;quot;#60a5fa&amp;quot;;x.font=&amp;quot;bold 18px Segoe UI&amp;quot;;x.fillText(&amp;quot;Gaz&amp;quot;,100,100);
 x.fillStyle=&amp;quot;#e2e8f0&amp;quot;;x.font=&amp;quot;16px Segoe UI&amp;quot;;x.fillText(&amp;quot;Hajm o‘zgarmoqda&amp;quot;,280,200);
}
vol.oninput=()=&amp;gt;drawPiston(+vol.value);drawPiston(100);

/* 2B: TEMPERATURE/PRESSURE */
const tr=document.getElementById(&amp;quot;tempRange&amp;quot;);
function drawPressure(T){
 let p=T/300;
 document.getElementById(&amp;quot;temp3&amp;quot;).textContent=T+&amp;quot; K&amp;quot;;
 document.getElementById(&amp;quot;tk&amp;quot;).textContent=T+&amp;quot; K&amp;quot;;
 document.getElementById(&amp;quot;pk&amp;quot;).textContent=p.toFixed(2)+&amp;quot; atm&amp;quot;;
 const c=document.getElementById(&amp;quot;pressureCanvas&amp;quot;),x=c.getContext(&amp;quot;2d&amp;quot;);
 x.clearRect(0,0,760,220);
 x.fillStyle=&amp;quot;#334155&amp;quot;;x.fillRect(110,35,540,145);
 let n=Math.min(45,Math.floor(20+T/15));
 for(let i=0;i&amp;lt;n;i++){
  let px=120+Math.random()*520,py=45+Math.random()*125;
  x.beginPath();x.arc(px,py,4,0,Math.PI*2);
  x.fillStyle=T&amp;gt;400?&amp;quot;#fb7185&amp;quot;:&amp;quot;#38bdf8&amp;quot;;x.fill();
 }
 x.fillStyle=&amp;quot;#e2e8f0&amp;quot;;x.font=&amp;quot;16px Segoe UI&amp;quot;;x.fillText(&amp;quot;V = const&amp;quot;,330,205);
}
tr.oninput=()=&amp;gt;drawPressure(+tr.value);drawPressure(300);

/* 3: TIRE */
const tire=document.getElementById(&amp;quot;tire&amp;quot;);
function drawTire(T){
 let p=2*(273+T)/(273+20);
 document.getElementById(&amp;quot;tireTemp&amp;quot;).textContent=T+&amp;quot; °C&amp;quot;;
 document.getElementById(&amp;quot;tirePressure&amp;quot;).textContent=p.toFixed(2)+&amp;quot; bar&amp;quot;;
 const c=document.getElementById(&amp;quot;tireCanvas&amp;quot;),x=c.getContext(&amp;quot;2d&amp;quot;);
 x.clearRect(0,0,760,230);
 x.beginPath();x.ellipse(380,115,230,82,0,0,Math.PI*2);
 x.lineWidth=30;x.strokeStyle=&amp;quot;#475569&amp;quot;;x.stroke();
 x.beginPath();x.ellipse(380,115,165,45,0,0,Math.PI*2);
 x.fillStyle=&amp;quot;#1e293b&amp;quot;;x.fill();
 x.fillStyle=&amp;quot;#60a5fa&amp;quot;;x.font=&amp;quot;bold 20px Segoe UI&amp;quot;;x.fillText(T&amp;gt;40?&amp;quot;Bosim oshmoqda&amp;quot;:&amp;quot;Bosim me’yorida&amp;quot;,295,120);
}
tire.oninput=()=&amp;gt;drawTire(+tire.value);drawTire(20);

function showAnswer(){document.getElementById(&amp;quot;answer&amp;quot;).style.display=&amp;quot;block&amp;quot;;}
&amp;lt;/script&amp;gt;
&amp;lt;/body&amp;gt;

&amp;lt;h1&amp;gt;Modda miqdori&amp;lt;/h1&amp;gt;&amp;lt;div class=&amp;quot;mut&amp;quot;&amp;gt;9-sinf fizika · molekulyar fizika asoslari&amp;lt;/div&amp;gt;
&amp;lt;div class=&amp;quot;tabs&amp;quot; role=&amp;quot;tablist&amp;quot;&amp;gt;&amp;lt;button class=&amp;quot;tab&amp;quot; role=&amp;quot;tab&amp;quot; aria-selected=&amp;quot;true&amp;quot;&amp;gt;Modda tuzilishi&amp;lt;/button&amp;gt;&amp;lt;button class=&amp;quot;tab&amp;quot; role=&amp;quot;tab&amp;quot; aria-selected=&amp;quot;false&amp;quot;&amp;gt;Avogadro doimiysi&amp;lt;/button&amp;gt;&amp;lt;button class=&amp;quot;tab&amp;quot; role=&amp;quot;tab&amp;quot; aria-selected=&amp;quot;false&amp;quot;&amp;gt;Masalalar&amp;lt;/button&amp;gt;&amp;lt;/div&amp;gt;

&amp;lt;section class=&amp;quot;sec&amp;quot; id=&amp;quot;s0&amp;quot;&amp;gt;

function decodeBase64Utf8(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i&lt;bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder(&#x27;utf-8&#x27;).decode(bytes)}
const frames=[...document.querySelectorAll(&#x27;.frame&#x27;)];
frames.forEach(f=&gt;{f.srcdoc=decodeBase64Utf8(f.dataset.b64)});
function showFrame(n){frames.forEach((f,i)=&gt;f.classList.toggle(&#x27;active&#x27;,i===n));document.querySelectorAll(&#x27;.tabs button&#x27;).forEach((b,i)=&gt;b.classList.toggle(&#x27;active&#x27;,i===n));window.scrollTo(0,0)}
showFrame(0);

}
